# Fast non-PPO comparison used by the integration test and as a first offline benchmark (no model needed).
name: Smoke benchmark (non-PPO, test split)
dataset: data/sample/synthetic_weather_tn_v1.csv
split: test
methods: [fixed_schedule, soil_threshold, lookahead_carat]
reference_method: fixed_schedule
seeds: [1, 2]
observation_budgets: [10]
sensor_noise_m3m3: [0.02]
aquacrop: false

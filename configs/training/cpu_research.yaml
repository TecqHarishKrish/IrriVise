# Research CPU preset: 5 seeds, longer training, capped wall time. Hours on a laptop CPU.
preset: cpu_research
total_timesteps: 500000
seeds: [42, 43, 44, 45, 46]
eval_freq_steps: 20000
early_stop_evals: 8
domain_randomization: true
max_wall_seconds: 43200
hyperparameters: {learning_rate: 0.0003, n_steps: 2048, batch_size: 64, n_epochs: 10, gamma: 0.99, gae_lambda: 0.95, clip_range: 0.2, ent_coef: 0.01, vf_coef: 0.5, max_grad_norm: 0.5, net_arch: [64, 64]}

# Standard CPU preset: 3 seeds, periodic validation, best checkpoint by validation reward.
preset: cpu_standard
total_timesteps: 150000
seeds: [42, 43, 44]
eval_freq_steps: 10000
early_stop_evals: 6
domain_randomization: true
max_wall_seconds: 7200
hyperparameters: {learning_rate: 0.0003, n_steps: 1024, batch_size: 64, n_epochs: 10, gamma: 0.99, gae_lambda: 0.95, clip_range: 0.2, ent_coef: 0.01, vf_coef: 0.5, max_grad_norm: 0.5, net_arch: [64, 64]}

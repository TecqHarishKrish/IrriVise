<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IrriVise — Think Before You Water. Local research platform for the CARAT irrigation decision method." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>IrriVise — Think Before You Water</title>
    <script>
      try {
        var t = localStorage.getItem('irrivise.theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

[alembic]
script_location = alembic
# The URL is injected at runtime from IRRIVISE_DATA_ROOT / IRRIVISE_DATABASE (see irrivise_api/db/session.py).
sqlalchemy.url = sqlite:///../../data/irrivise.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARN
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
